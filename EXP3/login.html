<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Hotel - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Meridian Hotel</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
      aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Rooms</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="catalogue.html">All Rooms</a></li>
            <li><a class="dropdown-item" href="catalogue.html">Single Room</a></li>
            <li><a class="dropdown-item" href="catalogue.html">Suite</a></li>
            <li><a class="dropdown-item" href="catalogue.html">Family Room</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
      </ul>
      <form class="d-flex" role="search">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" placeholder="Search rooms..." aria-label="Search">
        </div>
      </form>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="text-center mt-4">Login to Your Account</h1>

  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-5">

      <!-- Task 5: example dismissible alert, e.g. shown after a failed attempt -->
      <div class="alert alert-gold alert-dismissible fade show" role="alert">
        <i class="bi bi-info-circle me-1"></i> Use your registered email to sign in.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <form action="#" method="post" class="brand-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#" class="small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-gold w-100 mb-2">Login</button>
        <button type="button" class="btn btn-outline-navy w-100">Continue as Guest</button>
      </form>

      <p class="text-center">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p class="mb-0">&copy; 2026 Meridian Hotel.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
