<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian Hotel - Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <a href="index.html" class="logo">Meridian Hotel</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="catalogue.html">Rooms</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<div class="container">
  <h1 style="text-align:center;">Create an Account</h1>

  <form action="#" method="post">
    <div class="name-row">
      <div>
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" required>
      </div>
      <div>
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" required>
      </div>
    </div>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="2"></textarea>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <div class="checkbox-line">
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">I agree to the Terms and Privacy Policy</label>
    </div>

    <button type="submit" class="btn">Register</button>
  </form>

  <p style="text-align:center;">Already have an account? <a href="login.html">Login here</a></p>
</div>

<footer>
  <p>&copy; 2026 Meridian Hotel.</p>
</footer>

</body>
</html>
