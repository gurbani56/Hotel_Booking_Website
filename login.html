<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian Hotel - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <a href="index.html" class="logo">Meridian Hotel</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="catalogue.html">Rooms</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<div class="container">
  <h1 style="text-align:center;">Login to Your Account</h1>

  <form action="#" method="post">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <div class="form-row">
      <span><input type="checkbox" id="remember" name="remember"> <label for="remember">Remember me</label></span>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn">Login</button>
    <button type="button" class="btn btn-secondary">Continue as Guest</button>
  </form>

  <p style="text-align:center;">Don't have an account? <a href="register.html">Register here</a></p>
</div>

<footer>
  <p>&copy; 2026 Meridian Hotel.</p>
</footer>

</body>
</html>
